name: TVBox Auto Update

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 */6 * * *"  # 每6小时更新一次

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install requests
        run: pip install requests

      - name: Build TVBox config
        run: python TVBox-Auto/scripts/build.py

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add TVBox-Auto/tvbox_final.json
          git add TVBox-Auto/wex.json
          git add TVBox-Auto/live.m3u
          git commit -m "auto update tvbox configs" || exit 0
          git push
