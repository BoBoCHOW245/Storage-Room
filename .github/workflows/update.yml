name: TVBox Auto Update

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

# 解决Node.js 20废弃警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install requests
        run: pip install requests

      - name: Build TVBox config
        run: python TVBox-Auto/scripts/build.py

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          # 只保留下面这一行，其他都删掉
          git add TVBox-Auto/data/live.m3u
          git commit -m "auto update live.m3u" || exit 0
          git push
