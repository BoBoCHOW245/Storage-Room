name: TVBox Auto Update

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install requests
        run: pip install requests

      - name: Build TVBox config
        run: python TVBox-Auto/scripts/build.py

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          # git add TVBox-Auto/data/tvbox_final.json
          # git add TVBox-Auto/data/wex.json
          git add TVBox-Auto/data/live.m3u
          git commit -m "auto update tvbox" || exit 0
          git push

# 关闭失败邮件通知
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
