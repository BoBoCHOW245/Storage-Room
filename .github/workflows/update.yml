name: TVBox Auto Update

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

# 解决Node.js 20废弃警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install requests
        run: pip install requests

      # 关键：先检查脚本运行是否成功，打印日志方便排查
      - name: Build TVBox config (only live.m3u)
        run: |
          echo "开始运行Python脚本生成live.m3u..."
          python TVBox-Auto/scripts/build.py
          # 检查文件是否生成（打印文件内容，方便排查）
          ls -l TVBox-Auto/data/
          cat TVBox-Auto/data/live.m3u || echo "live.m3u文件不存在！"

      - name: Commit & Push (only live.m3u)
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          # 只添加live.m3u
          git add TVBox-Auto/data/live.m3u
          # 提交：如果没变化就不报错（避免exit code 1）
          git commit -m "auto update live.m3u" || echo "没有更新，跳过提交"
          git push
