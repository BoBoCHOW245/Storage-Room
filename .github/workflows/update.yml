name: TVBox Auto Update

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 */6 * * *"

# 关键：给 Action 写入仓库的权限！
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须开启，否则无法推送
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install requests
        run: pip install requests

      - name: Build TVBox config
        run: python TVBox-Auto/scripts/build.py

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add TVBox-Auto/tvbox_final.json
          # 即使没变化也不报错
          git commit -m "auto update tvbox" --allow-empty || exit 0
          # 用仓库的 token 推送
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
